<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<meta name="description" content="Line art references for tracing. Эскизы для обводки через камеру телефона.">
<meta name="p:domain_verify" content="0643227b0f9cd93004014c4d1b75ec0f"/>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Vellum</title>

<!-- аналитика: анонимные заходы, источники, устройства, страны -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="add8cea2-7112-48df-b940-2f2b758fa536"></script>

<style>
  :root{
    --bg:#0E0E10; --card:#1A1A1D; --ink:#ECEAE6; --dim:#807D77;
    --line:rgba(255,255,255,.11); --sunk:rgba(255,255,255,.05);
    --hot:#E8B84B; --ok:#5FB88B; --tap:52px;
    --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:500 14px/1.35 system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  body{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;padding:0}
  [hidden]{display:none !important}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}

/* ============ ШАПКИ ============ */
  .head{padding:calc(14px + var(--top)) 16px 10px;display:flex;align-items:center;gap:10px;flex:none}
  .head h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.015em;flex:1}
  .head h2{margin:0;font-size:17px;font-weight:600;flex:1}
  .ico{width:40px;height:40px;border-radius:12px;background:var(--sunk);
    display:grid;place-items:center;font-size:19px;flex:none}
  .ico:active{background:var(--line)}
  .ico.wide{width:auto;padding:0 14px;font-size:13px;font-weight:600}
  .ico.lng{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--dim)}
  .ico.act{background:var(--hot);color:#17150F}

/* ============ ЭКРАН 1: ПОЛКИ ============ */
  #shelves{flex:1;overflow-y:auto;padding-bottom:calc(28px + var(--bot));
    -webkit-overflow-scrolling:touch}

  .shelf{margin-bottom:26px;
    animation:rise .42s cubic-bezier(.22,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .shelf-top{display:flex;align-items:baseline;gap:10px;padding:0 16px 11px}
  .shelf-top h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
  .shelf-top .all{font-size:13px;color:var(--dim);padding:2px 0}
  .shelf-top .cnt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .rail{display:flex;gap:11px;overflow-x:auto;padding:2px 16px 4px;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail > *{scroll-snap-align:start;flex:none}

/* карточка эскиза */
  .card{position:relative;width:132px;aspect-ratio:3/4;border-radius:14px;
    overflow:hidden;background:var(--card);border:1px solid var(--line);
    transition:transform .11s ease}
  .card:active{transform:scale(.955)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;
    background:#fff;transition:opacity .15s}
  .card.done img{opacity:.32}
  .card.miss img{display:none}
  .card.miss::after{content:'V';position:absolute;inset:0;display:grid;place-items:center;
    font-size:38px;font-weight:600;color:rgba(236,234,230,.13)}

  .card .name{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 8px;font-size:11px;
    color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

  .flag{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;
    display:none;place-items:center;font-size:12px;line-height:1;
    background:rgba(10,10,12,.6);backdrop-filter:blur(6px)}
  .card.fav .flag.f{display:grid;background:var(--hot);color:#17150F}
  .card.done .flag.d{display:grid;background:var(--ok);color:#0C1F16;right:auto;left:7px}

/* карточка коллекции */
  .tile{position:relative;overflow:hidden;width:132px;aspect-ratio:3/4;border-radius:14px;
    background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;
    justify-content:flex-end;padding:13px;gap:5px;text-align:left;
    transition:transform .11s ease}
  .tile:active{transform:scale(.955)}
  .tile .em{font-size:23px;line-height:1;margin-bottom:auto}
  .tile .t{font-size:13px;font-weight:600;position:relative;z-index:2}
  .tile .s{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;position:relative;z-index:2}
  .tile.has .s{color:rgba(236,234,230,.72)}

  /* превью последних эскизов внутри коллекции */
  .tile .pv{position:absolute;inset:0;display:flex;z-index:0}
  .tile .pv img{flex:1;min-width:0;height:100%;object-fit:cover;background:#fff}
  .tile.has::after{content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(14,14,16,.12) 0%,rgba(14,14,16,.5) 52%,rgba(14,14,16,.88) 100%)}

  .tile.new{border-style:dashed;border-color:rgba(232,184,75,.42)}
  .tile.new .em{color:var(--hot)}
  .tile.get{border-style:dashed;border-color:rgba(95,184,139,.42)}
  .tile.get .em{color:var(--ok)}

/* платный пак */
  .card.lock.blur img{filter:blur(7px) saturate(.55) brightness(.62);transform:scale(1.14)}
  .card.lock::before{content:'';position:absolute;inset:0;background:rgba(14,14,16,.28);z-index:1}
  .card.lock .keyhole{position:absolute;inset:0;display:grid;place-items:center;
    font-size:21px;z-index:2;color:rgba(236,234,230,.9)}
  .card .tag{position:absolute;left:7px;bottom:7px;z-index:3;
    background:var(--hot);color:#17150F;font-size:10px;font-weight:650;
    padding:3px 7px;border-radius:99px;letter-spacing:.01em}
  .shelf.paid .shelf-top h3::after{content:' 🔒';font-size:12px}
  .pricetag{font-size:12px;font-weight:650;color:var(--hot);
    border:1px solid rgba(232,184,75,.4);border-radius:99px;padding:3px 9px}

/* ============ ЭКРАН 2: СПИСОК КАТЕГОРИИ ============ */
  #grid{flex:1;overflow-y:auto;padding:4px 16px calc(28px + var(--bot));
    display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:12px;align-content:start;-webkit-overflow-scrolling:touch}
  #grid .card{width:auto}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);
    padding:56px 24px;line-height:1.75;font-size:13px}
  .empty b{color:var(--ink);display:block;margin-bottom:6px;font-size:14px}

  .badge{position:absolute;top:7px;width:31px;height:31px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;line-height:1;z-index:3;
    background:rgba(10,10,12,.62);backdrop-filter:blur(6px);color:#fff}
  .badge.f{right:7px}
  .badge.d{right:44px}
  .badge.f.on{background:var(--hot);color:#17150F}
  .badge.d.on{background:var(--ok);color:#0C1F16}
  .badge.x{left:7px;right:auto;background:#E24B4A;color:#fff;font-size:15px}
  #grid .card.fav .flag,#grid .card.done .flag{display:none}

/* ============ ШТОРКА ПАКА ============ */
  #veil{position:fixed;inset:0;background:rgba(6,6,8,.66);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .24s;z-index:60}
  #veil.on{opacity:1;pointer-events:auto}

  #sheet, #howto, #heat{position:fixed;left:0;right:0;bottom:0;z-index:61;
    background:var(--card);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:8px 18px calc(20px + var(--bot));
    transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.8,.3,1)}
  #sheet.on, #howto.on, #heat.on{transform:none}
  #sheet .pull, #howto .pull, #heat .pull{width:38px;height:4px;border-radius:2px;
    background:var(--line);margin:0 auto 16px}
  #sheet h3, #howto h3, #heat h3{margin:0 0 6px;font-size:19px;font-weight:650;letter-spacing:-.01em}
  #sheet p, #howto p, #heat p{margin:0 0 16px;color:var(--dim);font-size:13px;line-height:1.6}
  #howto p#ht-p{color:var(--ink);font-size:14px}

  #heat ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  #heat li{font-size:13.5px;line-height:1.5;color:var(--dim);padding-left:16px;position:relative}
  #heat li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--hot)}
  #heat li b{color:var(--ink);font-weight:600}
  #sheet .strip{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px;
    scrollbar-width:none}
  #sheet .strip::-webkit-scrollbar{display:none}
  #sheet .strip img{width:74px;height:98px;flex:none;border-radius:10px;object-fit:cover;
    background:#fff}
  #sheet .strip img.blur{filter:blur(5px) brightness(.68) saturate(.5)}
  #buy{width:100%;min-height:var(--tap);border-radius:13px;background:var(--hot);
    color:#17150F;font-size:15px;font-weight:650;display:grid;place-items:center}
  #buy:active{transform:scale(.985)}
  #sheet .fine{margin:12px 0 0;font-size:11.5px;color:var(--dim);text-align:center}

/* ============ ЭКРАН 3: ОБВОДКА ============ */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #paper{position:fixed;inset:0;display:none;place-items:center;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 1px,transparent 1px 26px),
      radial-gradient(120% 90% at 50% 30%,#F2EFE7,#D9D4C6 65%,#A8A296);
    color:rgba(0,0,0,.3);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
  #paper.on{display:grid}

  #stage{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
  #art{max-width:100vw;max-height:100vh;transform-origin:center;will-change:transform;
    opacity:.5;background:#fff}
  #art.lines{filter:grayscale(1) contrast(2.4) brightness(1.08)}
  #art.inv{filter:invert(1) grayscale(1) contrast(2.4)}

  #grab{position:fixed;inset:0;touch-action:none}
  #grab.locked{pointer-events:none}

  #back{position:fixed;top:calc(10px + var(--top));left:12px;width:44px;height:44px;
    border-radius:50%;background:rgba(10,10,12,.62);backdrop-filter:blur(10px);
    color:#fff;display:grid;place-items:center;font-size:20px;z-index:5}

  #pin{position:fixed;top:calc(16px + var(--top));left:50%;transform:translateX(-50%);
    padding:6px 14px;border-radius:14px;background:rgba(232,184,75,.92);color:#17150F;
    display:none;font-size:12px;font-weight:600;z-index:5}
  #pin.on{display:block}

  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--bot));
    background:rgba(20,20,22,.84);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.12);
    display:flex;flex-direction:column;gap:9px;transition:transform .22s ease;z-index:5}
  #bar.hid{transform:translateY(112%)}

  .row{display:flex;gap:8px;align-items:center}
  #bar .row button{flex:1;min-height:var(--tap);border-radius:10px;font-size:13px;
    border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
    display:grid;place-items:center;padding:0 4px}
  #bar .row button:active{background:rgba(255,255,255,.15)}
  #bar .row button.on{background:var(--hot);border-color:var(--hot);color:#17150F}
  #bar .row button:disabled{opacity:.3}
  input[type=range]{flex:1;height:var(--tap);accent-color:var(--hot);background:none}
  .val{width:44px;color:#8A8781;font-variant-numeric:tabular-nums;text-align:right;font-size:12px}

  #tab{position:fixed;bottom:calc(8px + var(--bot));left:50%;transform:translateX(-50%);
    width:100px;height:34px;border-radius:17px;background:rgba(20,20,22,.84);
    border:1px solid rgba(255,255,255,.12);color:#8A8781;display:none;place-items:center;
    backdrop-filter:blur(14px);font-size:12px;z-index:5}
  #tab.on{display:grid}

  #upd{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--bot));z-index:70;
    background:rgba(26,26,29,.96);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px 11px 15px;display:none;align-items:center;gap:12px;
    font-size:13px;backdrop-filter:blur(14px);
    box-shadow:0 8px 26px rgba(0,0,0,.42);
    animation:rise .32s cubic-bezier(.22,.8,.3,1) both}
  #upd.on{display:flex}
  #upd span{flex:1;color:var(--dim)}
  #upd button{background:var(--hot);color:#17150F;font-weight:650;font-size:13px;
    padding:8px 15px;border-radius:9px}
  #upd button:active{transform:scale(.96)}

  #toast{position:fixed;left:50%;bottom:calc(96px + var(--bot));transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;max-width:84vw;text-align:center;z-index:90}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<!-- ЭКРАН 1: полки -->
<section id="lib" class="screen on">
  <div class="head">
    <h1>Vellum</h1>
    <button class="ico lng" id="lang">EN</button>
    <button class="ico" id="tips" data-i18n-aria="aTips">?</button>
    <button class="ico" id="add" data-i18n-aria="aAdd">＋</button>
  </div>
  <div id="shelves"></div>
</section>

<!-- ЭКРАН 2: список -->
<section id="list" class="screen">
  <div class="head">
    <button class="ico" id="lback" data-i18n-aria="aBack">‹</button>
    <h2 id="ltitle"></h2>
    <button class="ico wide" id="edit" hidden></button>
  </div>
  <div id="grid"></div>
</section>

<!-- ЭКРАН 3: обводка -->
<section id="draw" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="paper"><span data-i18n="noCam"></span></div>
  <div id="stage"><img id="art" alt=""></div>
  <div id="grab"></div>
  <button id="back" data-i18n-aria="aBackLib">‹</button>
  <div id="pin" data-i18n="pinned"></div>
  <div id="bar">
    <div class="row">
      <input id="op" type="range" min="5" max="100" value="50" data-i18n-aria="aOpacity">
      <span class="val" id="opv">50%</span>
    </div>
    <div class="row">
      <button id="lock"></button>
      <button id="torch" data-i18n="torch" disabled></button>
      <button id="fit" data-i18n="reset"></button>
    </div>
    <div class="row">
      <button id="lines" data-i18n="lines"></button>
      <button id="inv" data-i18n="invert"></button>
      <button id="fav2" data-i18n="fav2"></button>
      <button id="hide" data-i18n="hide"></button>
    </div>
  </div>
  <button id="tab" data-i18n="panel"></button>
</section>

<!-- шторка платного пака -->
<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="pull"></div>
  <h3 id="sh-t"></h3>
  <p id="sh-p"></p>
  <div class="strip" id="sh-strip"></div>
  <button id="buy"></button>
  <p class="fine" data-i18n="packFine"></p>
</div>

<!-- как установить, если браузер не умеет сам -->
<div id="howto" role="dialog" aria-modal="true" aria-labelledby="ht-t">
  <div class="pull"></div>
  <h3 id="ht-t"></h3>
  <p id="ht-p"></p>
  <p class="fine" data-i18n="installFine"></p>
</div>

<!-- почему греется телефон -->
<div id="heat" role="dialog" aria-modal="true" aria-labelledby="he-t">
  <div class="pull"></div>
  <h3 id="he-t" data-i18n="heatT"></h3>
  <p data-i18n="heatP"></p>
  <ul>
    <li data-i18n="heat1"></li>
    <li data-i18n="heat2"></li>
    <li data-i18n="heat3"></li>
    <li data-i18n="heat4"></li>
    <li data-i18n="heat5"></li>
  </ul>
  <p class="fine" data-i18n="heatFine"></p>
</div>

<!-- новая версия скачалась и ждёт перезагрузки -->
<div id="upd">
  <span data-i18n="updReady"></span>
  <button id="updgo" data-i18n="updGo"></button>
</div>

<div id="toast"></div>
<input id="file" type="file" accept="image/*" multiple hidden>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. КОНТЕНТ — правится здесь, остальной код трогать не нужно
   ═══════════════════════════════════════════════════════════════
   Картинки кладутся в папку img/ рядом с index.html.
   Имя файла в поле file. Если файла нет — карточка покажет
   заглушку с буквой V, приложение не сломается.               */

/* Названия — парой {ru, en}. Приложение подставит нужное само. */
const CATALOG = [
  { id:'portraits', title:{ru:'Портреты', en:'Portraits'}, items:[
    {id:'po1', name:{ru:'Портрет 1', en:'Portrait 1'}, file:'portret-1.jpg'},
    {id:'po2', name:{ru:'Портрет 2', en:'Portrait 2'}, file:'portret-2.png'},
    {id:'po3', name:{ru:'Портрет 3', en:'Portrait 3'}, file:'portret-3.png'},
    {id:'po4', name:{ru:'Портрет 4', en:'Portrait 4'}, file:'portret-4.png'},
    {id:'po5', name:{ru:'Портрет 5', en:'Portrait 5'}, file:'portret-5.png'},
  ]},
  { id:'animals', title:{ru:'Животные', en:'Animals'}, items:[
    {id:'an1', name:{ru:'Животное 1', en:'Animal 1'}, file:'animal_1.png'},
    {id:'an2', name:{ru:'Животное 2', en:'Animal 2'}, file:'animal-2.jpg'},
    {id:'an3', name:{ru:'Животное 3', en:'Animal 3'}, file:'animal-3.png'},
    {id:'an4', name:{ru:'Животное 4', en:'Animal 4'}, file:'animal-4.png'},
    {id:'an5', name:{ru:'Животное 5', en:'Animal 5'}, file:'animal-5.png'},
  ]},
  { id:'anime', title:{ru:'Аниме-стиль', en:'Anime style'}, items:[
    {id:'am1', name:{ru:'Аниме 1', en:'Anime 1'}, file:'anime-1.jpg'},
    {id:'am2', name:{ru:'Аниме 2', en:'Anime 2'}, file:'anime-2.png'},
    {id:'am3', name:{ru:'Аниме 3', en:'Anime 3'}, file:'anime-3.png'},
    {id:'am4', name:{ru:'Аниме 4', en:'Anime 4'}, file:'anime-4.png'},
    {id:'am5', name:{ru:'Аниме 5', en:'Anime 5'}, file:'anime-5.png'},
  ]},
  { id:'simple', title:{ru:'Простое и весёлое', en:'Simple and fun'}, items:[
    {id:'si1', name:{ru:'Простое 1', en:'Simple 1'}, file:'prostoe.png'},
    {id:'si2', name:{ru:'Простое 2', en:'Simple 2'}, file:'prostoe-2.png'},
    {id:'si3', name:{ru:'Простое 3', en:'Simple 3'}, file:'prostoe-3.png'},
    {id:'si4', name:{ru:'Простое 4', en:'Simple 4'}, file:'prostoe-4.png'},
    {id:'si5', name:{ru:'Простое 5', en:'Simple 5'}, file:'prostoe-5.png'},
  ]},
];

/* Платный пак. payUrl — ссылка на оплату (lava.top и т.п.).
   Пока пусто — кнопка честно скажет, что оплата ещё не открыта.

   state у каждого превью:
     'free'    — открыт, можно обводить прямо сейчас (образец)
     'preview' — виден чётко, но под замком
     'locked'  — размыт                                            */
const PACK = {
  id:'pack01',
  title:{ru:'Анатомия', en:'Anatomy'},
  note:{
    ru:'20 эскизов фигуры в одном стиле — пропорции, позы, движение. От простой стойки к сложному ракурсу.',
    en:'20 figure sketches in one style — proportions, poses, movement. From a simple stance to a complex angle.'
  },
  price:'$5',
  payUrl:'https://app.lava.top/products/0c356d2d-85f7-4693-8747-7b79fc7dde49',
  items:[
    {id:'pk1', name:null, file:'pack-1.png', state:'locked'},
    {id:'pk2', name:{ru:'Образец', en:'Sample'}, file:'pack-2.png', state:'free'},
    {id:'pk3', name:null, file:'pack-3.png', state:'preview'},

let toastT;

  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);

/* ── хранилище ──────────────────────────────────────────────────
   Загрузки пользователя лежат на телефоне (IndexedDB), не на сервере.
   Очистка данных Chrome их сотрёт — это ограничение веба.        */
let db;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('vellum', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    if(!d.objectStoreNames.contains('sk'))   d.createObjectStore('sk', {keyPath:'id'});
    if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
  };
  r.onsuccess = () => res(r.result);
  r.onerror   = () => rej(r.error);
});
const st = (s, m='readonly') => db.transaction(s, m).objectStore(s);
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const allSk = ()    => rq(st('sk').getAll());
const putSk = o     => rq(st('sk','readwrite').put(o));
const delSk = id    => rq(st('sk','readwrite').delete(id));
const getM  = k     => rq(st('meta').get(k));
const setM  = (k,v) => rq(st('meta','readwrite').put(v, k));

/* ═══════════════════════════════════════════════════════════════
   3. МОДЕЛЬ
   ═══════════════════════════════════════════════════════════════
   Встроенные эскизы — файлы в img/. Загруженные — блобы в IndexedDB.
   Общий вид карточки: {id, name, builtin, src|blob, fav, done}.
   Коллекции — это не отдельное хранилище, а фильтр по флагам.     */

let flags = {};      // флаги встроенных эскизов: {id:{fav,done}}
let mine  = [];      // загрузки пользователя
let urls  = [];      // объектные URL превью — чистятся при перерисовке

function builtinList(catId){
  const cat = CATALOG.find(c => c.id === catId);
  if(!cat) return [];
  return cat.items.map(s => {
    const f = flags[s.id] || {};
    return {id:s.id, name:tx(s.name), builtin:true, src:'img/' + s.file,
            fav:!!f.fav, done:!!f.done};
  });
}
const allBuiltin = () => CATALOG.flatMap(c => builtinList(c.id));
const mineList = () => mine.map(it => ({...it, builtin:false, src:null}));
const everything = () => [...mineList(), ...allBuiltin()];

async function toggleFlag(it, key){
  if(it.builtin){
    const f = flags[it.id] || (flags[it.id] = {});
    f[key] = !f[key];
    await setM('flags', flags);
  }else{
    const rec = mine.find(m => m.id === it.id);
    if(!rec) return;
    rec[key] = !rec[key];
    await putSk(rec);
  }
  it[key] = !it[key];
}

/* превью для загруженных: ужимаем, чтобы сетка не тормозила */
async function makeThumb(file, max = 420){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}

function thumbSrc(it){
  if(it.builtin) return it.src;
  const rec = mine.find(m => m.id === it.id);
  if(!rec) return '';
  const u = URL.createObjectURL(rec.thumb || rec.blob);
  urls.push(u);
  return u;
}

function freeUrls(){ urls.forEach(URL.revokeObjectURL); urls = []; }

/* ═══════════════════════════════════════════════════════════════
   4. ЭКРАН 1 — ПОЛКИ
   ═══════════════════════════════════════════════════════════════ */

function cardHTML(it, i){
  return `<button class="card${it.fav?' fav':''}${it.done?' done':''}" data-i="${i}">
      <img src="${esc(thumbSrc(it))}" alt="" loading="lazy"
           onerror="this.closest('.card').classList.add('miss')">
      <span class="flag f">★</span><span class="flag d">✓</span>
      ${it.name ? `<span class="name">${esc(it.name)}</span>` : ''}
    </button>`;
}

function shelves(){
  freeUrls();
  const box = $('shelves');
  box.innerHTML = '';
  let delay = 0;

  const shelf = (title, right, inner, cls='') => {
    const s = document.createElement('section');
    s.className = 'shelf ' + cls;
    s.style.animationDelay = delay + 'ms'; delay += 55;
    s.innerHTML = `<div class="shelf-top"><h3>${title}</h3>${right}</div>
                   <div class="rail">${inner}</div>`;
    box.appendChild(s);
    return s;
  };

  /* ── мои коллекции ── */
  const tile = (em, t, s, act, pics) => {
    const face = pics.length
      ? `<span class="pv">${pics.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</span>`
      : `<span class="em">${em}</span>`;
    return `<button class="tile${pics.length ? ' has' : ''}" data-act="${act}">
       ${face}<span class="t">${t}</span><span class="s">${s}</span>
     </button>`;
  };

  const pics = list => list.slice(0, 3).map(thumbSrc).filter(Boolean);
  const favs = everything().filter(i => i.fav);
  const dones = everything().filter(i => i.done);

  const cnt = n => n ? n + t('sk') : t('empty');

  const my = shelf(t('my'), '',
      tile('★', t('fav'),  cnt(favs.length),  'fav',  pics(favs)) +
      tile('✓', t('done'), cnt(dones.length), 'done', pics(dones)) +
      tile('☰', t('mine'), cnt(mine.length),  'mine', pics(mineList())) +
      `<button class="tile new" data-act="add">
         <span class="em">＋</span><span class="t">${t('addOwn')}</span>
         <span class="s">${t('fromGallery')}</span>
       </button>` +
      (canInstall() ? `<button class="tile get" data-act="install">
         <span class="em">⤓</span><span class="t">${t('install')}</span>
         <span class="s">${t('toHome')}</span>
       </button>` : ''));

  my.querySelector('.rail').onclick = e => {
    const b = e.target.closest('.tile'); if(!b) return;
    const a = b.dataset.act;
    if(a === 'add')     return $('file').click();
    if(a === 'install') return doInstall();
    if(a === 'fav')     return openList(t('fav'),  everything().filter(i => i.fav),  false, 'fav');
    if(a === 'done')    return openList(t('done'), everything().filter(i => i.done), false, 'done');
    openList(t('mine'), mineList(), true, 'mine');
  };

  /* ── категории библиотеки ── */
  for(const cat of CATALOG){
    const list = builtinList(cat.id);
    const s = shelf(esc(tx(cat.title)), `<span class="all">${t('all')}</span>`,
                    list.map(cardHTML).join(''));
    s.querySelector('.all').onclick = () => openList(tx(cat.title), builtinList(cat.id), false, 'cat');
    s.querySelector('.rail').onclick = e => {
      const b = e.target.closest('.card'); if(!b) return;
      openDraw(builtinList(cat.id)[+b.dataset.i]);
    };
  }

  /* ── платный пак ── */
  const packCards = PACK.items.map(p => {
    if(p.state === 'free'){
      const it = packFree();
      return `<button class="card${it.fav?' fav':''}${it.done?' done':''}" data-free="1">
          <img src="${esc(it.src)}" alt="" loading="lazy"
               onerror="this.closest('.card').classList.add('miss')">
          <span class="flag f">★</span><span class="flag d">✓</span>
          <span class="tag">${t('free')}</span>
        </button>`;
    }
    const blur = p.state === 'locked' ? ' blur' : '';
    return `<span class="card lock${blur}">
        <img src="img/${esc(p.file)}" alt="" loading="lazy"
             onerror="this.closest('.card').classList.add('miss')">
        <span class="keyhole">🔒</span>
      </span>`;
  }).join('');

  const paid = shelf(esc(tx(PACK.title)),
      `<span class="pricetag">${esc(PACK.price)}</span>`, packCards, 'paid');

  paid.onclick = e => {
    if(e.target.closest('[data-free]')) return openDraw(packFree());
    openSheet();
  };
}

/* Открытый образец из пака — обычный эскиз, флаги работают как у всех */
function packFree(){
  const p = PACK.items.find(i => i.state === 'free');
  if(!p) return null;
  const f = flags[p.id] || {};
  return {id:p.id, name:tx(p.name), builtin:true,
          src:'img/' + p.file, fav:!!f.fav, done:!!f.done};
}

/* ═══════════════════════════════════════════════════════════════
   5. ЭКРАН 2 — СПИСОК
   ═══════════════════════════════════════════════════════════════ */
let listItems = [], listEdit = false, canEdit = false, listTitle = '', listKind = '';

function openList(title, items, editable, kind){
  listTitle = title; listItems = items; canEdit = editable; listEdit = false;
  listKind = kind || '';
  $('ltitle').textContent = title;
  $('edit').hidden = !editable;
  $('edit').textContent = t('del');
  $('edit').classList.remove('act');
  show('list');
  history.pushState({list:1}, '');
  drawList();
  ev('open-list', {list:kind || title});
}

function drawList(){
  freeUrls();
  const g = $('grid'); g.innerHTML = '';

  if(!listItems.length){
    g.innerHTML = `<p class="empty"><b>${t('noneT')}</b>${
      canEdit           ? t('noneMine')
      : listKind === 'fav' ? t('noneFav')
      :                     t('noneDone')}</p>`;
    return;
  }

  listItems.forEach((it, i) => {
    const c = document.createElement('div');
    c.className = 'card' + (it.done ? ' done' : '');
    c.innerHTML =
      `<img src="${esc(thumbSrc(it))}" alt="" loading="lazy"
            onerror="this.closest('.card').classList.add('miss')">
       ${listEdit ? `<button class="badge x" aria-label="${TXT.aDel[lang]}">✕</button>` : ''}
       <button class="badge d${it.done?' on':''}" aria-label="${TXT.aDone[lang]}">✓</button>
       <button class="badge f${it.fav ?' on':''}" aria-label="${TXT.aFav[lang]}">★</button>
       ${it.name ? `<div class="name">${esc(it.name)}</div>` : ''}`;

    c.querySelector('.f').onclick = async e => {
      e.stopPropagation(); await toggleFlag(it, 'fav'); drawList();
    };
    c.querySelector('.d').onclick = async e => {
      e.stopPropagation(); await toggleFlag(it, 'done'); drawList();
    };
    if(listEdit) c.querySelector('.x').onclick = e => { e.stopPropagation(); remove(it); };
    else c.onclick = () => openDraw(it);

    g.appendChild(c);
  });
}

async function remove(it){
  if(it.builtin) return toast(t('noBuiltinDel'));
  if(!confirm(t('confirmDel', it.name))) return;
  await delSk(it.id);
  mine = mine.filter(m => m.id !== it.id);
  listItems = listItems.filter(x => x.id !== it.id);
  drawList();
  toast(t('deleted'));
}

$('lback').onclick = () => history.state?.list ? history.back() : closeList();
function closeList(){ show('lib'); shelves(); }

$('edit').onclick = () => {
  listEdit = !listEdit;
  $('edit').textContent = listEdit ? t('ok') : t('del');
  $('edit').classList.toggle('act', listEdit);
  drawList();
};

/* ── загрузка своих ── */
$('add').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if(!files.length) return;
  let n = 0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{
      const rec = {
        id: crypto.randomUUID(),
        name: f.name.replace(/\.[^.]+$/, '').slice(0, 40),
        blob: f, thumb: await makeThumb(f),
        added: Date.now(), fav:false, done:false
      };
      await putSk(rec);
      n++;
    }catch(err){ toast(t('failed', f.name)); }
  }
  mine = (await allSk()).sort((a,b) => b.added - a.added);
  if($('list').classList.contains('on') && canEdit){ listItems = mineList(); drawList(); }
  else shelves();
  if(n){ toast(n === 1 ? t('added1') : t('addedN', n)); ev('upload', {count:n}); }
};

/* ═══════════════════════════════════════════════════════════════
   6. УСТАНОВКА НА ГЛАВНЫЙ ЭКРАН
   ═══════════════════════════════════════════════════════════════
   Chromium перед своим баннером кидает beforeinstallprompt — ловим
   и вызываем установку своей кнопкой. Safari такого события не даёт,
   там остаётся только текстовая подсказка.                        */
let deferred = null;

const isStandalone = () =>
  matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* тайл прячем, если приложение уже стоит */
const canInstall = () => !isStandalone();

addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferred = e;
  if($('lib').classList.contains('on')) shelves();
});

addEventListener('appinstalled', () => {
  deferred = null;
  ev('installed');
  toast(t('installed'));
  if($('lib').classList.contains('on')) shelves();
});

/* Встроенные браузеры Instagram и TikTok установку не умеют вообще —
   там нужен выход в обычный браузер, иначе кнопка бесполезна. */
function inApp(){
  const ua = navigator.userAgent;
  if(/Instagram/i.test(ua))                            return 'Instagram';
  if(/BytedanceWebview|TikTok|musical_ly/i.test(ua))   return 'TikTok';
  if(/FBAN|FBAV|FB_IAB/i.test(ua))                     return 'Facebook';
  return null;
}

function hint(){
  const app = inApp();
  if(app) return t('inAppHint', app);

  const ua = navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(ua)) return t('iosHint');
  if(/Firefox/.test(ua))          return t('ffHint');
  return t('genHint');
}

async function doInstall(){
  ev('install-tap');
  if(deferred){
    deferred.prompt();
    const r = await deferred.userChoice.catch(() => null);
    deferred = null;
    if(r && r.outcome !== 'accepted') toast(t('installLater'));
    return;
  }
  $('ht-t').textContent = t('installTitle');
  $('ht-p').textContent = hint();
  $('upd').classList.remove('on');
  $('veil').classList.add('on');
  $('howto').classList.add('on');
}

/* ═══════════════════════════════════════════════════════════════
   7. ШТОРКА ПАКА
   ═══════════════════════════════════════════════════════════════ */
function openSheet(){
  $('upd').classList.remove('on');
  $('sh-t').textContent = tx(PACK.title);
  $('sh-p').textContent = tx(PACK.note);
  $('sh-strip').innerHTML = PACK.items.map(p =>
    `<img class="${p.state === 'locked' ? 'blur' : ''}" src="img/${esc(p.file)}"
          alt="" loading="lazy">`).join('');
  $('buy').textContent = t('buy', PACK.price);
  $('veil').classList.add('on');
  $('sheet').classList.add('on');
  ev('pack-open', {pack:PACK.id});
}
$('tips').onclick = () => {
  $('upd').classList.remove('on');
  $('veil').classList.add('on');
  $('heat').classList.add('on');
  history.pushState({sheet:1}, '');
  ev('tips-open');
};

function closeSheet(){
  $('veil').classList.remove('on');
  $('sheet').classList.remove('on');
  $('howto').classList.remove('on');
  $('heat').classList.remove('on');
  if(waiting && !$('draw').classList.contains('on')) $('upd').classList.add('on');
}
$('veil').onclick = closeSheet;
$('buy').onclick = () => {
  ev('pay-click', {pack:PACK.id, price:PACK.price});
  if(PACK.payUrl){ window.open(PACK.payUrl, '_blank', 'noopener'); return; }
  toast(t('payClosed'));
};

/* ═══════════════════════════════════════════════════════════════
   8. ЭКРАН 3 — ОБВОДКА
   ═══════════════════════════════════════════════════════════════ */
const cam = $('cam'), art = $('art'), grab = $('grab'), bar = $('bar');
let track = null, current = null, camOn = false, artUrl = null, drawFrom = 'lib';

/* Камера — главный источник нагрева, и это железо, а не код.
   Разрешение на нагрев влияет слабо (проверено на живых телефонах),
   поэтому оно вернулось к нормальному — картинка должна быть чёткой.
   А вот частота кадров влияет заметно, и она ограничена жёстко:
   лист под телефоном неподвижен, плавное видео тут не нужно.      */
async function startCam(){
  if(camOn) return;
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'},
              width:{ideal:1280}, height:{ideal:720},
              frameRate:{ideal:15, max:15} },
      audio:false
    });
    cam.srcObject = s;
    track = s.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('torch').disabled = !caps.torch;
    $('paper').classList.remove('on');
    camOn = true;
  }catch(e){
    $('paper').classList.add('on');
    toast(e.name === 'NotAllowedError' ? t('camDenied') : t('camFail', e.name));
  }
}

function stopCam(){
  if(cam.srcObject){
    cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = null;
  }
  track = null; camOn = false;
  $('torch').classList.remove('on');
}

let wake = null;
const keepAwake = async () => { try{ wake = await navigator.wakeLock.request('screen'); }catch(e){} };
const dropWake  = () => { if(wake){ wake.release().catch(()=>{}); wake = null; } };

document.addEventListener('visibilitychange', () => {
  const onDraw = $('draw').classList.contains('on');
  if(document.visibilityState === 'visible'){
    if(onDraw){ keepAwake(); startCam(); }
  }else{
    stopCam(); dropWake();
  }
});

function show(id){
  ['lib','list','draw'].forEach(s => $(s).classList.toggle('on', s === id));
  /* на обводке внизу своя панель — полоска обновления там мешала бы */
  if(id === 'draw') $('upd').classList.remove('on');
  else if(waiting)  $('upd').classList.add('on');
}

async function openDraw(it){
  current = it;
  drawFrom = $('list').classList.contains('on') ? 'list' : 'lib';
  if(artUrl){ URL.revokeObjectURL(artUrl); artUrl = null; }

  if(it.builtin){
    art.src = it.src;
  }else{
    const rec = mine.find(m => m.id === it.id);
    if(!rec) return toast(t('notFound'));
    artUrl = URL.createObjectURL(rec.blob);
    art.src = artUrl;
  }

  T.x = T.y = T.r = 0; T.s = 1; render();
  art.classList.remove('lines','inv');
  $('lines').classList.remove('on'); $('inv').classList.remove('on');
  $('fav2').classList.toggle('on', !!it.fav);
  show('draw');
  history.pushState({draw:1}, '');
  keepAwake();
  startCam();
  ev('trace-start', {sketch:it.id, kind: it.builtin ? 'library' : 'own'});
}

function closeDraw(){
  stopCam(); dropWake();
  if(drawFrom === 'list'){ show('list'); drawList(); }
  else { show('lib'); shelves(); }
}
$('back').onclick = () => history.state?.draw ? history.back() : closeDraw();

addEventListener('popstate', () => {
  const sheetOpen = $('sheet').classList.contains('on')
                 || $('howto').classList.contains('on')
                 || $('heat').classList.contains('on');
  if(sheetOpen) return closeSheet();
  if($('draw').classList.contains('on')) return closeDraw();
  if($('list').classList.contains('on')) closeList();
});

/* ── жесты: перемещение, масштаб, поворот ── */
const T = {x:0, y:0, s:1, r:0};
const pts = new Map();
let base = null, locked = false;
const render = () => art.style.transform =
  `translate(${T.x}px,${T.y}px) rotate(${T.r}rad) scale(${T.s})`;

function shape(){
  const a = [...pts.values()];
  if(!a.length) return null;
  if(a.length === 1) return {cx:a[0].x, cy:a[0].y, d:null, ang:null};
  const [p,q] = a;
  return {cx:(p.x+q.x)/2, cy:(p.y+q.y)/2,
          d:Math.hypot(q.x-p.x, q.y-p.y), ang:Math.atan2(q.y-p.y, q.x-p.x)};
}
const rebase = () => { const s = shape(); base = s ? {s, T:{...T}} : null; };

grab.addEventListener('pointerdown', e => {
  grab.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); rebase();
});
grab.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const s = shape(); if(!base || !s) return;
  if(s.d != null && base.s.d){
    T.s = Math.min(24, Math.max(.04, base.T.s * (s.d / base.s.d)));
    T.r = base.T.r + (s.ang - base.s.ang);
  }
  T.x = base.T.x + (s.cx - base.s.cx);
  T.y = base.T.y + (s.cy - base.s.cy);
  render();
});
const drop = e => { pts.delete(e.pointerId); rebase(); };
grab.addEventListener('pointerup', drop);
grab.addEventListener('pointercancel', drop);

/* ── кнопки панели ── */
$('op').oninput = e => {
  art.style.opacity = e.target.value / 100;
  $('opv').textContent = e.target.value + '%';
};

$('lock').onclick = e => {
  locked = !locked;
  grab.classList.toggle('locked', locked);
  e.target.classList.toggle('on', locked);
  e.target.textContent = locked ? t('unlock') : t('lock');
  $('pin').classList.toggle('on', locked);
};

$('torch').onclick = async e => {
  const on = !e.target.classList.contains('on');
  try{
    await track.applyConstraints({advanced:[{torch:on}]});
    e.target.classList.toggle('on', on);
  }catch(err){
    e.target.disabled = true;
    toast(t('noTorch'));
  }
};

$('lines').onclick = e => {
  art.classList.remove('inv'); $('inv').classList.remove('on');
  art.classList.toggle('lines');
  e.target.classList.toggle('on', art.classList.contains('lines'));
};
$('inv').onclick = e => {
  art.classList.remove('lines'); $('lines').classList.remove('on');
  art.classList.toggle('inv');
  e.target.classList.toggle('on', art.classList.contains('inv'));
};
$('fit').onclick = () => { T.x = T.y = T.r = 0; T.s = 1; render(); };

$('fav2').onclick = async e => {
  if(!current) return;
  await toggleFlag(current, 'fav');
  e.target.classList.toggle('on', current.fav);
  toast(current.fav ? t('inFav') : t('outFav'));
};

const panel = v => { bar.classList.toggle('hid', !v); $('tab').classList.toggle('on', !v); };
$('hide').onclick = () => panel(false);
$('tab').onclick  = () => panel(true);

/* ═══════════════════════════════════════════════════════════════
   9. ОБНОВЛЕНИЕ ПРИЛОЖЕНИЯ
   ═══════════════════════════════════════════════════════════════
   Новая версия скачивается в фоне и ждёт. Полоска внизу даёт
   применить её сразу; если не нажать — встанет при следующем
   запуске, как обычно. Появляется только когда есть что обновлять. */
let waiting = null, updT = null, reloading = false;

function showUpdate(worker){
  waiting = worker;
  $('upd').classList.add('on');
  clearTimeout(updT);
  updT = setTimeout(() => $('upd').classList.remove('on'), 14000);
}

$('updgo').onclick = () => {
  $('upd').classList.remove('on');
  if(waiting) waiting.postMessage({type:'SKIP_WAITING'});
};

function watchSW(){
  if(!('serviceWorker' in navigator)) return;

  navigator.serviceWorker.register('sw.js').then(reg => {
    if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);

    reg.addEventListener('updatefound', () => {
      const fresh = reg.installing;
      if(!fresh) return;
      fresh.addEventListener('statechange', () => {
        /* controller есть — значит это обновление, а не первая установка */
        if(fresh.state === 'installed' && navigator.serviceWorker.controller) showUpdate(fresh);
      });
    });
  }).catch(() => {});

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ═══════════════════════════════════════════════════════════════
   10. СТАРТ
   ═══════════════════════════════════════════════════════════════ */
$('lang').onclick = async () => {
  const next = lang === 'ru' ? 'en' : 'ru';
  await setLang(next);
  ev('lang-switch', {to:next});
  /* перерисовываем то, что открыто сейчас */
  if($('list').classList.contains('on')) closeList();
  else shelves();
};

(async () => {
  db = await openDB();
  flags = (await getM('flags')) || {};
  mine  = (await allSk()).sort((a,b) => b.added - a.added);
  await setLang((await getM('lang')) || detectLang(), false);
  shelves();
  watchSW();
})();
</script>
